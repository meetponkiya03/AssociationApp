<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SutraPlus - Add Record</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace !important;
    }
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-[#f4f8fc] h-screen w-screen overflow-hidden font-sans antialiased text-slate-800 flex flex-col m-0 p-0 select-none">

  <!-- Full-Width Top Header Navbar -->
  <header class="relative w-full bg-gradient-to-r from-blue-50/80 via-blue-100/50 to-blue-200/60 border-b border-blue-200/80 select-none overflow-hidden flex-shrink-0 z-20 shadow-xs">
    <!-- Wavy overlay -->
    <div class="absolute inset-0 pointer-events-none opacity-30">
      <svg class="w-full h-full object-cover" viewBox="0 0 1440 70" preserveAspectRatio="none" fill="none">
        <path d="M0,30 C320,65 680,5 1020,40 C1200,60 1340,20 1440,28 L1440,0 L0,0 Z" fill="#3b82f6" fill-opacity="0.3" />
      </svg>
    </div>

    <div class="relative z-10 flex items-center justify-between px-6 py-2.5">
      <!-- Left: Logo & Branding -->
      <div class="flex items-center gap-3.5">
        <img src="" alt="SutraPlus Logo" class="h-10 w-auto min-w-[36px] object-contain drop-shadow-sm" />
        <div class="flex flex-col">
          <h1 class="text-xl md:text-2xl font-bold tracking-tight text-[#0a2540] leading-tight font-sans">SutraPlus</h1>
          <p class="text-xs font-medium text-slate-600 tracking-wide font-sans">Inventory & Accounting for Liquor Outlets</p>
        </div>
      </div>

      <!-- Right: Role & Fiscal Year Context Badge -->
      <div class="flex items-center gap-2 text-sm font-semibold text-slate-700 bg-white/70 px-4 py-1.5 rounded-full border border-blue-200 shadow-xs font-sans">
        <span class="text-[#0c2444] font-bold">Trader</span>
        <span class="text-slate-400">|</span>
        <span class="text-slate-600">FY : <strong class="text-slate-800">2025 - 26</strong></span>
      </div>
    </div>
  </header>

  <!-- Full-Screen App Body -->
  <div class="flex flex-1 overflow-hidden w-full h-[calc(100vh-61px)]">
    <!-- Standardized 7-item Sidebar Navigation -->
    <aside class="w-64 min-w-[256px] bg-[#0c2444] text-white flex flex-col justify-start select-none py-5 px-3 shadow-xl flex-shrink-0 z-10 overflow-y-auto">
      <nav class="space-y-1.5 font-sans" id="sidebarNav">
        <!-- 1. Dashboard -->
        <a href="preview-dashboard.html" class="sidebar-item group flex items-center gap-3.5 px-4 py-2.5 rounded-lg text-sm text-[#c0d4ec] hover:bg-[#163864] hover:text-white transition-all duration-150 cursor-pointer">
          <svg class="w-5 h-5 flex-shrink-0 text-white" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
          <span class="font-medium tracking-wide">Dashboard</span>
        </a>

        <!-- 2. Add Record (Active) -->
        <a href="preview-add-record.html" class="sidebar-item active group flex items-center gap-3.5 px-4 py-2.5 rounded-lg text-sm font-semibold bg-[#1976d2] text-white shadow-sm transition-all duration-150 cursor-pointer">
          <svg class="w-5 h-5 flex-shrink-0 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
          <span class="font-medium tracking-wide">Add Record</span>
        </a>

        <!-- 3. Import from Excel -->
        <a href="preview-import-excel.html" class="sidebar-item group flex items-center gap-3.5 px-4 py-2.5 rounded-lg text-sm text-[#c0d4ec] hover:bg-[#163864] hover:text-white transition-all duration-150 cursor-pointer">
          <div class="w-5 h-5 flex-shrink-0 flex items-center justify-center bg-white/20 rounded border border-white/30 text-xs font-bold text-white">X</div>
          <span class="font-medium tracking-wide">Import from Excel</span>
        </a>

        <!-- 4. Records -->
        <a href="preview-view-records.html" class="sidebar-item group flex items-center gap-3.5 px-4 py-2.5 rounded-lg text-sm text-[#c0d4ec] hover:bg-[#163864] hover:text-white transition-all duration-150 cursor-pointer">
          <svg class="w-5 h-5 flex-shrink-0 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
          <span class="font-medium tracking-wide">Records</span>
        </a>

        <!-- 5. Reports -->
        <a href="#reports" class="sidebar-item group flex items-center gap-3.5 px-4 py-2.5 rounded-lg text-sm text-[#c0d4ec] hover:bg-[#163864] hover:text-white transition-all duration-150 cursor-pointer">
          <svg class="w-5 h-5 flex-shrink-0 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
          <span class="font-medium tracking-wide">Reports</span>
        </a>

        <!-- 6. Settings -->
        <a href="preview-settings.html" class="sidebar-item group flex items-center gap-3.5 px-4 py-2.5 rounded-lg text-sm text-[#c0d4ec] hover:bg-[#163864] hover:text-white transition-all duration-150 cursor-pointer">
          <svg class="w-5 h-5 flex-shrink-0 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          <span class="font-medium tracking-wide">Settings</span>
        </a>

        <!-- 7. Logout -->
        <a href="preview-login.html" class="sidebar-item group flex items-center gap-3.5 px-4 py-2.5 rounded-lg text-sm text-[#f87171] hover:bg-[#163864] hover:text-white transition-all duration-150 cursor-pointer">
          <svg class="w-5 h-5 flex-shrink-0 text-[#f87171] group-hover:text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          <span class="font-medium tracking-wide">Logout</span>
        </a>
      </nav>
    </aside>

    <!-- Main Workspace -->
    <main class="flex-1 h-full overflow-y-auto bg-[#f4f8fc]">
      <section class="p-6 md:p-10 w-full max-w-5xl mx-auto font-sans">
        <div class="flex items-center gap-3 mb-6">
          <div class="text-[#1976d2] flex-shrink-0">
            <svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><circle cx="12" cy="14" r="3" fill="#1976d2" stroke="none"></circle><line x1="12" y1="12.5" x2="12" y2="15.5" stroke="#ffffff" stroke-width="1.8"></line><line x1="10.5" y1="14" x2="13.5" y2="14" stroke="#ffffff" stroke-width="1.8"></line></svg>
          </div>
          <h2 class="text-2xl md:text-3xl font-bold tracking-tight text-[#0c2340]">Add Record</h2>
        </div>

        <form class="bg-white rounded-2xl border border-slate-200/90 shadow-sm p-6 md:p-8 max-w-xl" onsubmit="event.preventDefault(); alert('Record added successfully!');">
          <div class="space-y-5">
            <div class="grid grid-cols-1 md:grid-cols-12 gap-2 md:gap-4 items-center">
              <label class="md:col-span-4 text-sm font-semibold text-slate-800">
                Date <span class="text-red-500 font-bold">*</span>
              </label>
              <div class="md:col-span-8 relative">
                <input type="text" value="11-11-2026" class="w-full bg-white border border-slate-300 rounded-lg px-3.5 py-2 text-sm text-slate-800 pr-10 focus:ring-2 focus:ring-[#1976d2]" />
                <span class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-slate-500">
                  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                </span>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-12 gap-2 md:gap-4 items-center">
              <label class="md:col-span-4 text-sm font-semibold text-slate-800">
                Invoice Number <span class="text-red-500 font-bold">*</span>
              </label>
              <div class="md:col-span-8">
                <input type="text" value="INV-10234" class="w-full bg-white border border-slate-300 rounded-lg px-3.5 py-2 text-sm text-slate-800 focus:ring-2 focus:ring-[#1976d2]" />
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-12 gap-2 md:gap-4 items-center">
              <label class="md:col-span-4 text-sm font-semibold text-slate-800">
                Trader <span class="text-red-500 font-bold">*</span>
              </label>
              <div class="md:col-span-8 relative">
                <input type="text" value="M/s. Sunrise Traders" class="w-full bg-white border border-slate-300 rounded-lg px-3.5 py-2 text-sm text-slate-800 pr-10 focus:ring-2 focus:ring-[#1976d2]" />
                <button type="button" class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-500 hover:text-blue-600">
                  <svg class="w-4 h-4 text-[#1976d2]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-12 gap-2 md:gap-4 items-center">
              <label class="md:col-span-4 text-sm font-semibold text-slate-800">
                No of Bags <span class="text-red-500 font-bold">*</span>
              </label>
              <div class="md:col-span-8">
                <input type="number" value="125" class="w-full bg-white border border-slate-300 rounded-lg px-3.5 py-2 text-sm text-slate-800 focus:ring-2 focus:ring-[#1976d2]" />
              </div>
            </div>
          </div>

          <hr class="border-t border-slate-200 my-6" />

          <div class="flex items-center justify-center gap-4 pt-1">
            <button type="submit" class="bg-[#2e7d32] hover:bg-[#256828] text-white font-semibold text-sm px-8 py-2.5 rounded-lg flex items-center gap-2 shadow-sm cursor-pointer transition-colors">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
              <span>Submit</span>
            </button>
            <button type="reset" class="bg-[#e2e8f0] hover:bg-slate-300 text-slate-700 font-semibold text-sm px-8 py-2.5 rounded-lg border border-slate-300 flex items-center gap-2 cursor-pointer transition-colors">
              <svg class="w-4 h-4 text-slate-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
              <span>Clear</span>
            </button>
          </div>
        </form>
      </section>
    </main>
  </div>
</body>
</html>
