<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SutraPlus - User Login</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace !important;
    }
    img:not([src]), img[src=""] {
      display: none !important;
    }
  </style>
</head>
<body class="bg-[#f0f6fc] min-h-screen h-screen flex items-center justify-center p-4 font-sans select-none text-slate-800">

  <!-- Step 1: User Login Card (Matching Screenshot Step 1) -->
  <div class="w-full max-w-sm bg-white rounded-2xl shadow-xl border border-slate-200/90 overflow-hidden flex flex-col">
    <!-- Titlebar Header with Brand Logo & Wave -->
    <header class="relative w-full bg-gradient-to-r from-blue-50/90 via-blue-100/60 to-blue-200/70 border-b border-blue-200/80 px-5 py-3 overflow-hidden">
      <div class="absolute inset-0 pointer-events-none opacity-30">
        <svg class="w-full h-full object-cover" viewBox="0 0 600 60" preserveAspectRatio="none" fill="none">
          <path d="M0,25 C150,55 350,5 500,35 C550,45 580,20 600,25 L600,0 L0,0 Z" fill="#3b82f6" fill-opacity="0.3" />
        </svg>
      </div>
      <div class="relative z-10 flex items-center gap-3">
        <!-- Crisp Brand Icon -->
        <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-amber-500 via-red-500 to-rose-600 p-0.5 shadow-2xs flex-shrink-0 flex items-center justify-center">
          <div class="w-full h-full bg-white rounded-[7px] flex items-center justify-center">
            <svg class="w-5 h-5 text-amber-700" viewBox="0 0 24 24" fill="currentColor">
              <path d="M7 2h10v2H7zm0 18h10v2H7zm2-14h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2zm2 2v6h2V10h-2z"/>
            </svg>
          </div>
        </div>
        <img src="" alt="" class="h-9 w-auto min-w-[32px] object-contain drop-shadow-xs" />
        <div class="flex flex-col">
          <h1 class="text-lg font-bold tracking-tight text-[#0a2540] leading-tight font-sans">SutraPlus</h1>
          <p class="text-[11px] font-medium text-slate-600 font-sans">Inventory & Accounting for Liquor Outlets</p>
        </div>
      </div>
    </header>

    <!-- Login Body -->
    <div class="p-8 flex flex-col items-center">
      <div class="flex items-center gap-2.5 mb-6">
        <svg class="w-6 h-6 fill-[#0c2444]" viewBox="0 0 24 24">
          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
        <h2 class="text-xl font-bold text-[#0c2340] font-sans">User Login</h2>
      </div>

      <form action="preview-select-role.html" method="get" class="w-full space-y-4">
        <!-- Username Input -->
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
          </span>
          <input 
            type="text" 
            name="username"
            value="admin" 
            placeholder="Username"
            class="w-full bg-white border border-slate-300 rounded-lg pl-10 pr-3.5 py-2 text-sm text-slate-800 font-sans focus:outline-none focus:ring-2 focus:ring-[#1976d2] focus:border-transparent transition-all shadow-xs" 
            required 
          />
        </div>

        <!-- Password Input -->
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
              <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
            </svg>
          </span>
          <input 
            type="password" 
            name="password"
            value="••••••" 
            placeholder="Password"
            class="w-full bg-white border border-slate-300 rounded-lg pl-10 pr-3.5 py-2 text-sm text-slate-800 tracking-widest font-sans focus:outline-none focus:ring-2 focus:ring-[#1976d2] focus:border-transparent transition-all shadow-xs" 
            required 
          />
        </div>

        <!-- Submit Button -->
        <div class="pt-2">
          <button 
            type="submit" 
            class="w-full bg-[#1976d2] hover:bg-[#1565c0] active:bg-[#0d47a1] text-white font-semibold text-sm py-2.5 px-4 rounded-lg flex items-center justify-center gap-2 shadow-sm transition-all duration-150 cursor-pointer font-sans"
          >
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
              <polyline points="10 17 15 12 10 7"></polyline>
              <line x1="15" y1="12" x2="3" y2="12"></line>
            </svg>
            <span>Login</span>
          </button>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
