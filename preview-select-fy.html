<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SutraPlus - Select Financial Year</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace !important;
    }
    /* Prevent image broken-text overlap */
    img:not([src]), img[src=""] {
      display: none !important;
    }
  </style>
</head>
<body class="bg-[#f0f6fc] min-h-screen h-screen flex items-center justify-center p-4 font-sans select-none text-slate-800">

  <!-- Step 3: Select Financial Year Card (Matching Screenshot Step 3) -->
  <div class="w-full max-w-sm bg-white rounded-2xl shadow-xl border border-slate-200/90 flex flex-col relative">
    
    <!-- Header with Brand Logo & Wave -->
    <header class="relative w-full bg-gradient-to-r from-blue-50/90 via-blue-100/60 to-blue-200/70 border-b border-blue-200/80 px-5 py-3 overflow-hidden rounded-t-2xl">
      <!-- Wavy background overlay -->
      <div class="absolute inset-0 pointer-events-none opacity-30">
        <svg class="w-full h-full object-cover" viewBox="0 0 600 60" preserveAspectRatio="none" fill="none">
          <path d="M0,25 C150,55 350,5 500,35 C550,45 580,20 600,25 L600,0 L0,0 Z" fill="#3b82f6" fill-opacity="0.3" />
        </svg>
      </div>
      <div class="relative z-10 flex items-center gap-3">
        <!-- Crisp SutraPlus Brand Icon / Logo Placeholder -->
        <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-amber-500 via-red-500 to-rose-600 p-0.5 shadow-2xs flex-shrink-0 flex items-center justify-center">
          <div class="w-full h-full bg-white rounded-[7px] flex items-center justify-center">
            <!-- Liquor bottle & ledger clipboard icon -->
            <svg class="w-5 h-5 text-amber-700" viewBox="0 0 24 24" fill="currentColor">
              <path d="M7 2h10v2H7zm0 18h10v2H7zm2-14h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2zm2 2v6h2V10h-2z"/>
            </svg>
          </div>
        </div>
        <img src="" alt="" class="h-9 w-auto min-w-[32px] object-contain drop-shadow-xs" />
        <div class="flex flex-col">
          <h1 class="text-lg font-bold tracking-tight text-[#0a2540] leading-tight font-sans">SutraPlus</h1>
          <p class="text-[11px] font-medium text-slate-600 font-sans">Inventory & Accounting for Liquor Outlets</p>
        </div>
      </div>
    </header>

    <!-- Card Body -->
    <div class="p-8 flex flex-col items-center">
      <!-- Title Icon & Heading -->
      <div class="flex items-center gap-2.5 mb-6">
        <svg class="w-6 h-6 stroke-[#0c2444] fill-none stroke-2" viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        <h2 class="text-xl font-bold text-[#0c2340] font-sans">Select Financial Year</h2>
      </div>

      <!-- Proper Financial Year Dropdown Form -->
      <form action="preview-dashboard.html" method="get" class="w-full">
        
        <!-- PROPER DROPDOWN CONTAINER -->
        <div class="relative w-full mb-6" id="fyDropdownContainer">
          
          <!-- Dropdown Trigger Button (closed by default) -->
          <button 
            type="button" 
            id="fyDropdownTrigger"
            onclick="toggleDropdown()"
            aria-haspopup="listbox"
            aria-expanded="false"
            class="w-full bg-white border border-slate-300 hover:border-slate-400 focus:border-[#1976d2] focus:ring-2 focus:ring-[#1976d2]/30 rounded-lg px-4 py-2.5 text-sm font-semibold text-slate-800 flex items-center justify-between shadow-xs transition-all cursor-pointer font-sans"
          >
            <span id="selectedFyDisplay">2025 - 26</span>
            <svg id="fyChevronIcon" class="w-4 h-4 text-slate-500 transition-transform duration-200" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>

          <!-- Hidden Native Select (Keeps form value synchronized) -->
          <select id="nativeFySelect" name="financialYear" class="hidden">
            <option value="2026 - 27">2026 - 27</option>
            <option value="2025 - 26" selected>2025 - 26</option>
            <option value="2024 - 25">2024 - 25</option>
            <option value="2023 - 24">2023 - 24</option>
            <option value="2022 - 23">2022 - 23</option>
          </select>

          <!-- Floating Dropdown Menu (Hidden by default, floats over card on click) -->
          <div 
            id="fyDropdownMenu" 
            class="hidden absolute top-full left-0 right-0 z-50 mt-1.5 bg-white border border-slate-200 rounded-lg shadow-xl overflow-hidden text-sm divide-y divide-slate-100 font-sans animate-in fade-in zoom-in-95 duration-100"
            role="listbox"
          >
            <div 
              onclick="pickYear('2026 - 27')" 
              data-year="2026 - 27"
              class="fy-option px-4 py-2.5 hover:bg-blue-50 text-slate-700 cursor-pointer font-medium flex items-center justify-between transition-colors"
            >
              <span>2026 - 27</span>
              <span class="check-icon hidden text-white">✓</span>
            </div>

            <div 
              onclick="pickYear('2025 - 26')" 
              data-year="2025 - 26"
              class="fy-option px-4 py-2.5 bg-[#1976d2] text-white font-semibold cursor-pointer shadow-inner flex items-center justify-between transition-colors"
            >
              <span>2025 - 26</span>
              <span class="check-icon text-white text-xs font-bold">✓</span>
            </div>

            <div 
              onclick="pickYear('2024 - 25')" 
              data-year="2024 - 25"
              class="fy-option px-4 py-2.5 hover:bg-blue-50 text-slate-700 cursor-pointer font-medium flex items-center justify-between transition-colors"
            >
              <span>2024 - 25</span>
              <span class="check-icon hidden text-white">✓</span>
            </div>

            <div 
              onclick="pickYear('2023 - 24')" 
              data-year="2023 - 24"
              class="fy-option px-4 py-2.5 hover:bg-blue-50 text-slate-700 cursor-pointer font-medium flex items-center justify-between transition-colors"
            >
              <span>2023 - 24</span>
              <span class="check-icon hidden text-white">✓</span>
            </div>

            <div 
              onclick="pickYear('2022 - 23')" 
              data-year="2022 - 23"
              class="fy-option px-4 py-2.5 hover:bg-blue-50 text-slate-700 cursor-pointer font-medium flex items-center justify-between transition-colors"
            >
              <span>2022 - 23</span>
              <span class="check-icon hidden text-white">✓</span>
            </div>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex items-center gap-3 w-full justify-center">
          <button 
            type="submit" 
            class="flex-1 bg-[#2e7d32] hover:bg-[#256828] active:bg-[#1e5220] text-white font-semibold text-sm py-2 px-4 rounded-lg flex items-center justify-center gap-1.5 shadow-sm transition-all duration-150 cursor-pointer font-sans"
          >
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            <span>Proceed</span>
          </button>

          <a 
            href="preview-select-role.html" 
            class="flex-1 border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 font-semibold text-sm py-2 px-4 rounded-lg flex items-center justify-center gap-1.5 shadow-xs transition-all duration-150 cursor-pointer font-sans"
          >
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
            <span>Cancel</span>
          </a>
        </div>
      </form>
    </div>
  </div>

  <!-- Interactive Dropdown Logic -->
  <script>
    function toggleDropdown() {
      const menu = document.getElementById('fyDropdownMenu');
      const trigger = document.getElementById('fyDropdownTrigger');
      const chevron = document.getElementById('fyChevronIcon');
      const isHidden = menu.classList.contains('hidden');

      if (isHidden) {
        menu.classList.remove('hidden');
        trigger.setAttribute('aria-expanded', 'true');
        chevron.classList.add('rotate-180');
      } else {
        closeDropdown();
      }
    }

    function closeDropdown() {
      const menu = document.getElementById('fyDropdownMenu');
      const trigger = document.getElementById('fyDropdownTrigger');
      const chevron = document.getElementById('fyChevronIcon');
      if (menu && !menu.classList.contains('hidden')) {
        menu.classList.add('hidden');
        trigger.setAttribute('aria-expanded', 'false');
        chevron.classList.remove('rotate-180');
      }
    }

    function pickYear(year) {
      // 1. Update trigger label
      document.getElementById('selectedFyDisplay').innerText = year;
      
      // 2. Update hidden native select
      const nativeSelect = document.getElementById('nativeFySelect');
      if (nativeSelect) {
        nativeSelect.value = year;
      }

      // 3. Update active item styling in menu
      const options = document.querySelectorAll('.fy-option');
      options.forEach(opt => {
        const check = opt.querySelector('.check-icon');
        if (opt.getAttribute('data-year') === year) {
          opt.className = "fy-option px-4 py-2.5 bg-[#1976d2] text-white font-semibold cursor-pointer shadow-inner flex items-center justify-between transition-colors";
          if (check) check.classList.remove('hidden');
        } else {
          opt.className = "fy-option px-4 py-2.5 hover:bg-blue-50 text-slate-700 cursor-pointer font-medium flex items-center justify-between transition-colors";
          if (check) check.classList.add('hidden');
        }
      });

      // 4. Close the dropdown on selection
      closeDropdown();
    }

    // Close dropdown on outside click
    document.addEventListener('click', function(event) {
      const container = document.getElementById('fyDropdownContainer');
      if (container && !container.contains(event.target)) {
        closeDropdown();
      }
    });

    // Close on Escape key
    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape') {
        closeDropdown();
      }
    });
  </script>
</body>
</html>
