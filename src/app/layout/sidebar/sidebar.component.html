<!-- =========================================================================
     SutraPlus Sidebar Navigation Component
     Angular Component: SidebarComponent
     Selector: app-sidebar
     Template: sidebar.component.html
     Description: Left primary navigation bar with icons, labels, active states,
                  and bottom quick-actions matching SutraPlus design.
========================================================================= -->

<aside class="w-64 min-w-[256px] bg-[#0c2444] text-white flex flex-col justify-start select-none py-5 px-3 h-full shadow-xl flex-shrink-0 z-10 overflow-y-auto">
  <!-- Top Navigation Links (Standardized 7 Items Matching Mockup) -->
  <nav class="space-y-1.5 font-sans">
    <!-- 1. Dashboard -->
    <a 
      routerLink="/dashboard" 
      routerLinkActive="bg-[#1976d2] text-white font-semibold shadow-sm" 
      [routerLinkActiveOptions]="{exact: true}"
      class="group flex items-center gap-3.5 px-4 py-2.5 rounded-lg text-sm text-[#c0d4ec] hover:bg-[#163864] hover:text-white transition-all duration-150 cursor-pointer"
    >
      <svg class="w-5 h-5 flex-shrink-0 text-white" viewBox="0 0 24 24" fill="currentColor">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
      </svg>
      <span class="font-medium tracking-wide">Dashboard</span>
    </a>

    <!-- 2. Add Record -->
    <a 
      routerLink="/add-record" 
      routerLinkActive="bg-[#1976d2] text-white font-semibold shadow-sm" 
      class="group flex items-center gap-3.5 px-4 py-2.5 rounded-lg text-sm text-[#c0d4ec] hover:bg-[#163864] hover:text-white transition-all duration-150 cursor-pointer"
    >
      <svg class="w-5 h-5 flex-shrink-0 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="12" y1="18" x2="12" y2="12"></line>
        <line x1="9" y1="15" x2="15" y2="15"></line>
      </svg>
      <span class="font-medium tracking-wide">Add Record</span>
    </a>

    <!-- 3. Import from Excel -->
    <a 
      routerLink="/import-excel" 
      routerLinkActive="bg-[#1976d2] text-white font-semibold shadow-sm" 
      class="group flex items-center gap-3.5 px-4 py-2.5 rounded-lg text-sm text-[#c0d4ec] hover:bg-[#163864] hover:text-white transition-all duration-150 cursor-pointer"
    >
      <div class="w-5 h-5 flex-shrink-0 flex items-center justify-center bg-white/20 rounded border border-white/30 text-xs font-bold text-white">
        X
      </div>
      <span class="font-medium tracking-wide">Import from Excel</span>
    </a>

    <!-- 4. Records -->
    <a 
      routerLink="/view-records" 
      routerLinkActive="bg-[#1976d2] text-white font-semibold shadow-sm" 
      class="group flex items-center gap-3.5 px-4 py-2.5 rounded-lg text-sm text-[#c0d4ec] hover:bg-[#163864] hover:text-white transition-all duration-150 cursor-pointer"
    >
      <svg class="w-5 h-5 flex-shrink-0 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
        <polyline points="10 9 9 9 8 9"></polyline>
      </svg>
      <span class="font-medium tracking-wide">Records</span>
    </a>

    <!-- 5. Cross Check -->
    <a 
      routerLink="/cross-check" 
      routerLinkActive="bg-[#1976d2] text-white font-semibold shadow-sm" 
      class="group flex items-center gap-3.5 px-4 py-2.5 rounded-lg text-sm text-[#c0d4ec] hover:bg-[#163864] hover:text-white transition-all duration-150 cursor-pointer"
    >
      <svg class="w-5 h-5 flex-shrink-0 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 11l3 3L22 4"></path>
        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
      </svg>
      <span class="font-medium tracking-wide">Cross Check</span>
    </a>

    <!-- 6. Receipt Entry -->
    <a 
      routerLink="/receipt-entry" 
      routerLinkActive="bg-[#1976d2] text-white font-semibold shadow-sm" 
      class="group flex items-center gap-3.5 px-4 py-2.5 rounded-lg text-sm text-[#c0d4ec] hover:bg-[#163864] hover:text-white transition-all duration-150 cursor-pointer"
    >
      <div class="w-5 h-5 flex-shrink-0 flex items-center justify-center font-bold text-white text-sm">
        ₹
      </div>
      <span class="font-medium tracking-wide">Receipt Entry</span>
    </a>

    <!-- 7. Reports -->
    <a 
      routerLink="/reports" 
      routerLinkActive="bg-[#1976d2] text-white font-semibold shadow-sm" 
      class="group flex items-center gap-3.5 px-4 py-2.5 rounded-lg text-sm text-[#c0d4ec] hover:bg-[#163864] hover:text-white transition-all duration-150 cursor-pointer"
    >
      <svg class="w-5 h-5 flex-shrink-0 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="20" x2="18" y2="10"></line>
        <line x1="12" y1="20" x2="12" y2="4"></line>
        <line x1="6" y1="20" x2="6" y2="14"></line>
      </svg>
      <span class="font-medium tracking-wide">Reports</span>
    </a>

    <!-- 6. Settings -->
    <a 
      routerLink="/settings" 
      routerLinkActive="bg-[#1976d2] text-white font-semibold shadow-sm" 
      class="group flex items-center gap-3.5 px-4 py-2.5 rounded-lg text-sm text-[#c0d4ec] hover:bg-[#163864] hover:text-white transition-all duration-150 cursor-pointer"
    >
      <svg class="w-5 h-5 flex-shrink-0 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
      <span class="font-medium tracking-wide">Settings</span>
    </a>

    <!-- 7. Logout -->
    <a 
      (click)="onLogout()"
      routerLink="/login" 
      class="group flex items-center gap-3.5 px-4 py-2.5 rounded-lg text-sm text-[#f87171] hover:bg-[#163864] hover:text-white transition-all duration-150 cursor-pointer"
    >
      <svg class="w-5 h-5 flex-shrink-0 text-[#f87171] group-hover:text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      <span class="font-medium tracking-wide">Logout</span>
    </a>
  </nav>

  <!-- Sidebar Edit Button (Only visible on Cross Check view) -->
  <div *ngIf="showEditButton" class="pt-4 mt-6 border-t border-slate-700/60">
    <button 
      type="button" 
      (click)="onEdit()"
      class="w-full bg-[#163864] hover:bg-[#1e467d] active:bg-[#122e54] text-white font-bold text-sm py-2 px-4 rounded-lg shadow-sm transition-all duration-150 cursor-pointer text-left flex items-center gap-2"
    >
      <svg class="w-4 h-4 text-blue-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h9"></path>
        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
      </svg>
      <span>Edit</span>
    </button>
  </div>
</aside>
