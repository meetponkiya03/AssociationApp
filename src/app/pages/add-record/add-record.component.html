<!-- =========================================================================
     SutraPlus - Add Record Screen Component
     Angular Component: AddRecordComponent
     Selector: app-add-record
     Template: add-record.component.html
     Description: Form to create and save single liquor invoice records.
========================================================================= -->

<section class="p-6 md:p-8 w-full max-w-5xl mx-auto font-sans">
  <!-- Page Header Title -->
  <div class="flex items-center gap-3 mb-6">
    <div class="text-[#1976d2] flex-shrink-0">
      <!-- Blue Document with Plus Icon matching screenshot -->
      <svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <circle cx="12" cy="14" r="3" fill="#1976d2" stroke="none"></circle>
        <line x1="12" y1="12.5" x2="12" y2="15.5" stroke="#ffffff" stroke-width="1.8"></line>
        <line x1="10.5" y1="14" x2="13.5" y2="14" stroke="#ffffff" stroke-width="1.8"></line>
      </svg>
    </div>
    <h2 class="text-2xl md:text-3xl font-bold tracking-tight text-[#0c2340]">
      Add Record
    </h2>
  </div>

  <!-- Form Card Container -->
  <!-- Angular: [formGroup]="addRecordForm" (ngSubmit)="onSubmit()" -->
  <form class="bg-white rounded-2xl border border-slate-200/90 shadow-sm p-6 md:p-8 max-w-xl">
    <div class="space-y-5">
      <!-- 1. Date Field -->
      <div class="grid grid-cols-1 md:grid-cols-12 gap-2 md:gap-4 items-center">
        <label for="recordDate" class="md:col-span-4 text-sm font-semibold text-slate-800 flex items-center gap-1">
          Date <span class="text-red-500 font-bold">*</span>
        </label>
        <div class="md:col-span-8 relative">
          <!-- Angular: formControlName="date" -->
          <input 
            type="text" 
            id="recordDate"
            name="date"
            value="11-11-2026"
            placeholder="DD-MM-YYYY"
            class="w-full bg-white border border-slate-300 rounded-lg px-3.5 py-2 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-[#1976d2] focus:border-transparent transition-all pr-10"
            required
          />
          <span class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-slate-500">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
          </span>
        </div>
      </div>

      <!-- 2. Invoice Number Field -->
      <div class="grid grid-cols-1 md:grid-cols-12 gap-2 md:gap-4 items-center">
        <label for="invoiceNumber" class="md:col-span-4 text-sm font-semibold text-slate-800 flex items-center gap-1">
          Invoice Number <span class="text-red-500 font-bold">*</span>
        </label>
        <div class="md:col-span-8">
          <!-- Angular: formControlName="invoiceNumber" -->
          <input 
            type="text" 
            id="invoiceNumber"
            name="invoiceNumber"
            value="INV-10234"
            placeholder="e.g. INV-10234"
            class="w-full bg-white border border-slate-300 rounded-lg px-3.5 py-2 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-[#1976d2] focus:border-transparent transition-all"
            required
          />
        </div>
      </div>

      <!-- 3. Trader Selection Field -->
      <div class="grid grid-cols-1 md:grid-cols-12 gap-2 md:gap-4 items-center">
        <label for="trader" class="md:col-span-4 text-sm font-semibold text-slate-800 flex items-center gap-1">
          Trader <span class="text-red-500 font-bold">*</span>
        </label>
        <div class="md:col-span-8 relative">
          <!-- Angular: formControlName="trader" -->
          <input 
            type="text" 
            id="trader"
            name="trader"
            value="M/s. Sunrise Traders"
            placeholder="Search trader..."
            class="w-full bg-white border border-slate-300 rounded-lg px-3.5 py-2 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-[#1976d2] focus:border-transparent transition-all pr-10"
            required
          />
          <button 
            type="button" 
            title="Search Trader"
            class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-500 hover:text-slate-800"
          >
            <svg class="w-4 h-4 text-[#1976d2]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </button>
        </div>
      </div>

      <!-- 4. No of Bags Field -->
      <div class="grid grid-cols-1 md:grid-cols-12 gap-2 md:gap-4 items-center">
        <label for="noOfBags" class="md:col-span-4 text-sm font-semibold text-slate-800 flex items-center gap-1">
          No of Bags <span class="text-red-500 font-bold">*</span>
        </label>
        <div class="md:col-span-8">
          <!-- Angular: formControlName="noOfBags" -->
          <input 
            type="number" 
            id="noOfBags"
            name="noOfBags"
            value="125"
            min="1"
            class="w-full bg-white border border-slate-300 rounded-lg px-3.5 py-2 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-[#1976d2] focus:border-transparent transition-all"
            required
          />
        </div>
      </div>
    </div>

    <!-- Form Divider -->
    <hr class="border-t border-slate-200 my-6" />

    <!-- Action Buttons -->
    <div class="flex items-center justify-center gap-4 pt-1">
      <!-- Submit Button -->
      <button 
        type="submit"
        class="bg-[#2e7d32] hover:bg-[#256828] active:bg-[#1b4d1e] text-white font-semibold text-sm px-8 py-2.5 rounded-lg flex items-center gap-2 shadow-sm transition-all duration-150"
      >
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <span>Submit</span>
      </button>

      <!-- Clear Button -->
      <!-- Angular: (click)="onClearForm()" -->
      <button 
        type="reset"
        class="bg-[#e2e8f0] hover:bg-slate-300 active:bg-slate-400 text-slate-700 font-semibold text-sm px-8 py-2.5 rounded-lg border border-slate-300 flex items-center gap-2 shadow-xs transition-all duration-150"
      >
        <svg class="w-4 h-4 text-slate-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
        </svg>
        <span>Clear</span>
      </button>
    </div>
  </form>
</section>
