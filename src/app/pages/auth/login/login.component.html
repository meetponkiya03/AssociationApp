<!-- =========================================================================
     SutraPlus - Step 1: User Login Screen Component
     Angular Component: LoginComponent
     Selector: app-login
     Template: login.component.html
     Description: Step 1 of the authentication flow. Captures username and password.
========================================================================= -->

<div class="min-h-screen w-full bg-[#f4f8fc] flex items-center justify-center p-4 font-sans select-none">
  <!-- Login Window Card Container matching screenshot -->
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-200/90 overflow-hidden flex flex-col">
    
    <!-- Top Window Titlebar Header with Brand Logo & Wavy Banner -->
    <header class="relative w-full bg-gradient-to-r from-blue-50/90 via-blue-100/60 to-blue-200/70 border-b border-blue-200/80 px-5 py-3 overflow-hidden">
      <!-- Decorative Wavy Overlay -->
      <div class="absolute inset-0 pointer-events-none opacity-30">
        <svg class="w-full h-full object-cover" viewBox="0 0 600 60" preserveAspectRatio="none" fill="none">
          <path d="M0,25 C150,55 350,5 500,35 C550,45 580,20 600,25 L600,0 L0,0 Z" fill="#3b82f6" fill-opacity="0.3" />
        </svg>
      </div>

      <div class="relative z-10 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <!-- Empty image tag reserved for client logo -->
          <img src="" alt="SutraPlus Logo" class="h-9 w-auto min-w-[32px] object-contain drop-shadow-xs" />
          <div class="flex flex-col">
            <h1 class="text-lg font-bold tracking-tight text-[#0a2540] leading-tight">SutraPlus</h1>
            <p class="text-[11px] font-medium text-slate-600">Inventory & Accounting for Liquor Outlets</p>
          </div>
        </div>
      </div>
    </header>

    <!-- Card Body Form -->
    <div class="p-8 md:p-10 flex flex-col items-center">
      <!-- Heading with User Icon -->
      <div class="flex items-center gap-2.5 mb-7">
        <div class="text-[#0c2444]">
          <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
        </div>
        <h2 class="text-xl font-bold tracking-tight text-[#0c2340]">User Login</h2>
      </div>

      <!-- Angular Form: [formGroup]="loginForm" (ngSubmit)="onLogin()" -->
      <form class="w-full space-y-4">
        <!-- Username Input Field -->
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
          </span>
          <!-- Angular: formControlName="username" -->
          <input 
            type="text" 
            id="loginUsername"
            name="username"
            value="admin"
            placeholder="Username" 
            class="w-full bg-white border border-slate-300 rounded-lg pl-10 pr-3.5 py-2 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-[#1976d2] focus:border-transparent transition-all shadow-xs"
            required
          />
        </div>

        <!-- Password Input Field -->
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
              <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
            </svg>
          </span>
          <!-- Angular: formControlName="password" -->
          <input 
            type="password" 
            id="loginPassword"
            name="password"
            value="••••••"
            placeholder="Password" 
            class="w-full bg-white border border-slate-300 rounded-lg pl-10 pr-3.5 py-2 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-[#1976d2] focus:border-transparent transition-all shadow-xs tracking-widest"
            required
          />
        </div>

        <!-- Submit Login Button -->
        <div class="pt-2">
          <!-- Angular: [routerLink]="['/select-role']" or (click)="onLoginSubmit()" -->
          <button 
            type="submit"
            class="w-full bg-[#1976d2] hover:bg-[#1565c0] active:bg-[#0d47a1] text-white font-semibold text-sm py-2.5 px-4 rounded-lg flex items-center justify-center gap-2 shadow-sm transition-all duration-150 cursor-pointer"
          >
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
              <polyline points="10 17 15 12 10 7"></polyline>
              <line x1="15" y1="12" x2="3" y2="12"></line>
            </svg>
            <span>Login</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
