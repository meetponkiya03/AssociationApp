<!-- =========================================================================
     SutraPlus - Step 3: Select Financial Year Screen Component
     Angular Component: SelectFyComponent
     Selector: app-select-fy
     Template: select-fy.component.html
     Description: Step 3 of the flow. Select fiscal period before entering Dashboard.
========================================================================= -->

<div class="min-h-screen w-full bg-[#f4f8fc] flex items-center justify-center p-4 font-sans select-none">
  <!-- Card Container matching screenshot -->
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-200/90 overflow-hidden flex flex-col">

    <!-- Top Window Titlebar Header with Brand Logo -->
    <header
      class="relative w-full bg-gradient-to-r from-blue-50/90 via-blue-100/60 to-blue-200/70 border-b border-blue-200/80 px-5 py-3 overflow-hidden">
      <div class="absolute inset-0 pointer-events-none opacity-30">
        <svg class="w-full h-full object-cover" viewBox="0 0 600 60" preserveAspectRatio="none" fill="none">
          <path d="M0,25 C150,55 350,5 500,35 C550,45 580,20 600,25 L600,0 L0,0 Z" fill="#3b82f6" fill-opacity="0.3" />
        </svg>
      </div>

      <div class="relative z-10 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <img src="" alt="SutraPlus Logo" class="h-9 w-auto min-w-[32px] object-contain drop-shadow-xs" />
          <div class="flex flex-col">
            <h1 class="text-lg font-bold tracking-tight text-[#0a2540] leading-tight">SutraPlus</h1>
            <p class="text-[11px] font-medium text-slate-600"></p>
          </div>
        </div>
      </div>
    </header>

    <!-- Card Body Form -->
    <div class="p-8 md:p-10 flex flex-col items-center">
      <!-- Heading with Calendar Icon -->
      <div class="flex items-center gap-2.5 mb-7">
        <div class="text-[#0c2444]">
          <svg class="w-6 h-6 fill-none stroke-current stroke-2" viewBox="0 0 24 24" stroke-linecap="round"
            stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
        </div>
        <h2 class="text-xl font-bold tracking-tight text-[#0c2340]">Select Financial Year</h2>
      </div>

      <!-- Financial Year Select Box & Dropdown Container -->
      <div class="w-full mb-8">
        <!-- Input Selector Header -->
        <div class="relative w-full">
          <div
            class="w-full bg-white border border-slate-300 rounded-lg px-4 py-2 text-sm font-semibold text-slate-800 flex items-center justify-between shadow-xs">
            <span>2025 - 26</span>
            <svg class="w-4 h-4 text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
        </div>

        <!-- Open Dropdown List matching screenshot -->
        <div
          class="w-full mt-2 bg-white border border-slate-200 rounded-lg shadow-md overflow-hidden text-sm divide-y divide-slate-100">
          <div class="px-4 py-2 hover:bg-slate-50 text-slate-700 cursor-pointer font-medium">
            2026 - 27
          </div>
          <!-- Selected Option (Active Blue) -->
          <div class="px-4 py-2 bg-[#1976d2] text-white font-medium cursor-pointer shadow-inner">
            2025 - 26
          </div>
          <div class="px-4 py-2 hover:bg-slate-50 text-slate-700 cursor-pointer font-medium">
            2024 - 25
          </div>
          <div class="px-4 py-2 hover:bg-slate-50 text-slate-700 cursor-pointer font-medium">
            2023 - 24
          </div>
          <div class="px-4 py-2 hover:bg-slate-50 text-slate-700 cursor-pointer font-medium">
            2022 - 23
          </div>
        </div>
      </div>

      <!-- Action Buttons Row -->
      <div class="flex items-center gap-4 w-full justify-center">
        <!-- Proceed Button -->
        <!-- Angular: (click)="onProceed()" [routerLink]="['/dashboard']" -->
        <button type="button"
          class="flex-1 bg-[#2e7d32] hover:bg-[#256828] active:bg-[#1b4d1e] text-white font-semibold text-sm py-2 px-4 rounded-lg flex items-center justify-center gap-2 shadow-sm transition-all duration-150 cursor-pointer">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span>Proceed</span>
        </button>

        <!-- Cancel Button -->
        <!-- Angular: (click)="onCancel()" [routerLink]="['/select-role']" -->
        <button type="button"
          class="flex-1 border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 font-semibold text-sm py-2 px-4 rounded-lg flex items-center justify-center gap-2 shadow-xs transition-all duration-150 cursor-pointer">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
          <span>Cancel</span>
        </button>
      </div>
    </div>
  </div>
</div>
