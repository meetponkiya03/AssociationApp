<!-- =========================================================================
     SutraPlus - Step 2: Select User Type / Role Screen Component
     Angular Component: SelectRoleComponent
     Selector: app-select-role
     Template: select-role.component.html
     Description: Step 2 of the flow. Choose between Trader or Commission Agent.
========================================================================= -->

<div class="min-h-screen w-full bg-[#f4f8fc] flex items-center justify-center p-4 font-sans select-none">
  <!-- Card Container matching screenshot -->
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-200/90 overflow-hidden flex flex-col">
    
    <!-- Top Window Titlebar Header with Brand Logo -->
    <header class="relative w-full bg-gradient-to-r from-blue-50/90 via-blue-100/60 to-blue-200/70 border-b border-blue-200/80 px-5 py-3 overflow-hidden">
      <div class="absolute inset-0 pointer-events-none opacity-30">
        <svg class="w-full h-full object-cover" viewBox="0 0 600 60" preserveAspectRatio="none" fill="none">
          <path d="M0,25 C150,55 350,5 500,35 C550,45 580,20 600,25 L600,0 L0,0 Z" fill="#3b82f6" fill-opacity="0.3" />
        </svg>
      </div>

      <div class="relative z-10 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <img src="" alt="SutraPlus Logo" class="h-9 w-auto min-w-[32px] object-contain drop-shadow-xs" />
          <div class="flex flex-col">
            <h1 class="text-lg font-bold tracking-tight text-[#0a2540] leading-tight">SutraPlus</h1>
            <p class="text-[11px] font-medium text-slate-600">Inventory & Accounting for Liquor Outlets</p>
          </div>
        </div>
      </div>
    </header>

    <!-- Card Body Form -->
    <div class="p-8 md:p-10 flex flex-col items-center">
      <!-- Heading with User Group Icon -->
      <div class="flex items-center gap-2.5 mb-7">
        <div class="text-[#0c2444]">
          <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
            <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
          </svg>
        </div>
        <h2 class="text-xl font-bold tracking-tight text-[#0c2340]">Select User Type</h2>
      </div>

      <!-- Role Selection Cards -->
      <div class="w-full space-y-4 mb-8">
        <!-- Option 1: Trader (Selected by default) -->
        <!-- Angular: (click)="selectRole('Trader')" [ngClass]="{'border-[#1976d2] bg-[#dbeafe]': selectedRole === 'Trader'}" -->
        <button 
          type="button" 
          id="roleTrader"
          class="w-full flex items-center justify-start gap-4 p-4 rounded-xl border-2 border-[#1976d2] bg-[#dbeafe] text-slate-800 transition-all duration-150 cursor-pointer shadow-xs hover:border-[#1565c0]"
        >
          <!-- Storefront Icon matching screenshot -->
          <div class="w-9 h-9 flex items-center justify-center text-[#0c2444]">
            <svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"></path>
              <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
              <path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"></path>
              <path d="M2 7h20"></path>
              <path d="M22 7a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2"></path>
            </svg>
          </div>
          <span class="text-base font-bold text-[#0c2340]">Trader</span>
        </button>

        <!-- Option 2: Commission Agent -->
        <!-- Angular: (click)="selectRole('Commission Agent')" [ngClass]="{'border-[#1976d2] bg-[#dbeafe]': selectedRole === 'Commission Agent'}" -->
        <button 
          type="button" 
          id="roleCommissionAgent"
          class="w-full flex items-center justify-start gap-4 p-4 rounded-xl border border-slate-300 bg-white text-slate-700 transition-all duration-150 cursor-pointer shadow-xs hover:bg-slate-50 hover:border-slate-400"
        >
          <!-- Handshake Icon matching screenshot -->
          <div class="w-9 h-9 flex items-center justify-center text-slate-700">
            <svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="m11 17 2 2a1 1 0 0 0 1.42 0l3.58-3.58a1 1 0 0 0 0-1.42l-2-2"></path>
              <path d="m18 11 2-2a1 1 0 0 0 0-1.42l-3.58-3.58a1 1 0 0 0-1.42 0l-2 2"></path>
              <path d="m9 15-4-4a2 2 0 0 1 0-2.83l3.17-3.17a2 2 0 0 1 2.83 0l4 4"></path>
              <path d="m15 9 4 4a2 2 0 0 1 0 2.83l-3.17 3.17a2 2 0 0 1-2.83 0l-4-4"></path>
            </svg>
          </div>
          <span class="text-base font-bold text-slate-800">Commission Agent</span>
        </button>
      </div>

      <!-- Action Buttons Row -->
      <div class="flex items-center gap-4 w-full justify-center">
        <!-- Continue Button -->
        <!-- Angular: (click)="onContinueRole()" [routerLink]="['/select-fy']" -->
        <button 
          type="button"
          class="flex-1 bg-[#2e7d32] hover:bg-[#256828] active:bg-[#1b4d1e] text-white font-semibold text-sm py-2 px-4 rounded-lg flex items-center justify-center gap-2 shadow-sm transition-all duration-150 cursor-pointer"
        >
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span>Continue</span>
        </button>

        <!-- Cancel Button -->
        <!-- Angular: (click)="onCancel()" [routerLink]="['/login']" -->
        <button 
          type="button"
          class="flex-1 border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 font-semibold text-sm py-2 px-4 rounded-lg flex items-center justify-center gap-2 shadow-xs transition-all duration-150 cursor-pointer"
        >
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
          <span>Cancel</span>
        </button>
      </div>
    </div>
  </div>
</div>
