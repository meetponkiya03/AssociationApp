<!-- =========================================================================
     SutraPlus - View Records Screen Component
     Angular Component: ViewRecordsComponent
     Selector: app-view-records
     Template: view-records.component.html
     Description: Master liquor outlets party-wise records list by month
                  with total quantity aggregation badge and Edit/Delete actions.
========================================================================= -->

<section class="p-6 md:p-8 w-full max-w-6xl mx-auto font-sans">
  <!-- Screen Header Title -->
  <div class="flex items-center gap-3 mb-6">
    <div class="text-[#1976d2] flex-shrink-0">
      <!-- Blue Document with Plus Icon -->
      <svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <circle cx="12" cy="14" r="3" fill="#1976d2" stroke="none"></circle>
        <line x1="12" y1="12.5" x2="12" y2="15.5" stroke="#ffffff" stroke-width="1.8"></line>
        <line x1="10.5" y1="14" x2="13.5" y2="14" stroke="#ffffff" stroke-width="1.8"></line>
      </svg>
    </div>
    <h2 class="text-2xl md:text-3xl font-bold tracking-tight text-[#0c2340]">
      View Records
    </h2>
  </div>

  <!-- Filter & Action Bar Card -->
  <div class="bg-white rounded-xl border border-slate-200/90 shadow-xs p-4 mb-5 flex flex-wrap items-center justify-between gap-4">
    <!-- Month Selection -->
    <div class="flex items-center gap-3">
      <label for="viewRecordsMonth" class="text-sm font-semibold text-slate-800">
        Select Month
      </label>
      
      <!-- Month Dropdown Input -->
      <!-- Angular: [(ngModel)]="selectedMonth" (ngModelChange)="onMonthChange($event)" -->
      <div class="relative min-w-[200px]">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
          <svg class="w-4 h-4 text-slate-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
        </div>

        <select 
          id="viewRecordsMonth"
          class="w-full bg-white border border-slate-300 rounded-lg pl-9 pr-8 py-1.5 text-sm font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-[#1976d2] focus:border-transparent appearance-none cursor-pointer"
        >
          <option value="2026-11" selected>November - 2026</option>
          <option value="2026-10">October - 2026</option>
          <option value="2026-09">September - 2026</option>
          <option value="2026-08">August - 2026</option>
        </select>

        <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-slate-500">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>
      </div>
    </div>

    <!-- Refresh Action Button -->
    <!-- Angular: (click)="loadRecords()" [disabled]="isLoading" -->
    <button 
      type="button"
      class="border border-slate-300 bg-white hover:bg-slate-50 active:bg-slate-100 text-slate-700 font-medium text-sm px-4 py-1.5 rounded-lg flex items-center gap-2 shadow-xs transition-colors duration-150 cursor-pointer"
    >
      <svg class="w-4 h-4 text-slate-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
      <span>Refresh</span>
    </button>
  </div>

  <!-- Data Table Container -->
  <div class="bg-white rounded-xl border border-slate-200/90 shadow-sm overflow-hidden mb-5">
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse text-xs md:text-sm">
        <!-- Table Header -->
        <thead>
          <tr class="bg-[#1565c0] text-white">
            <th scope="col" class="py-2.5 px-4 text-center font-semibold w-16 border-r border-blue-400/40">
              S.No
            </th>
            <th scope="col" class="py-2.5 px-4 font-semibold border-r border-blue-400/40 min-w-[220px]">
              Party Name
            </th>
            <th scope="col" class="py-2.5 px-4 text-center font-semibold border-r border-blue-400/40 min-w-[180px]">
              GSTIN
            </th>
            <th scope="col" class="py-2.5 px-4 text-right font-semibold border-r border-blue-400/40 min-w-[130px]">
              No Of Bags
            </th>
            <th scope="col" class="py-2.5 px-4 text-center font-semibold min-w-[110px]">
              Actions
            </th>
          </tr>
        </thead>

        <!-- Table Body -->
        <!-- Angular: <tbody *ngFor="let item of recordsList; let i = index"> -->
        <tbody class="divide-y divide-slate-200 bg-white">
          <!-- Row 1 -->
          <tr class="hover:bg-slate-50/60 transition-colors">
            <td class="py-2.5 px-4 text-center text-slate-800 font-medium border-r border-slate-200">1</td>
            <td class="py-2.5 px-4 text-slate-800 font-medium border-r border-slate-200">M/s. ABC Traders</td>
            <td class="py-2.5 px-4 text-center text-slate-700 font-mono text-xs border-r border-slate-200">29ABCDE1234F1Z5</td>
            <td class="py-2.5 px-4 text-right text-slate-800 font-semibold border-r border-slate-200">50</td>
            <td class="py-2.5 px-4 text-center">
              <div class="flex items-center justify-center gap-1.5">
                <button 
                  type="button" 
                  title="Edit Record"
                  class="p-1.5 rounded-md text-blue-600 hover:text-blue-800 hover:bg-blue-50 active:bg-blue-100 transition-colors cursor-pointer"
                >
                  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 20h9"></path>
                    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                  </svg>
                </button>
                <button 
                  type="button" 
                  title="Delete Record"
                  class="p-1.5 rounded-md text-red-500 hover:text-red-700 hover:bg-red-50 active:bg-red-100 transition-colors cursor-pointer"
                >
                  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    <line x1="10" y1="11" x2="10" y2="17"></line>
                    <line x1="14" y1="11" x2="14" y2="17"></line>
                  </svg>
                </button>
              </div>
            </td>
          </tr>

          <!-- Row 2 -->
          <tr class="hover:bg-slate-50/60 transition-colors">
            <td class="py-2.5 px-4 text-center text-slate-800 font-medium border-r border-slate-200">2</td>
            <td class="py-2.5 px-4 text-slate-800 font-medium border-r border-slate-200">M/s. Royal Distributors</td>
            <td class="py-2.5 px-4 text-center text-slate-700 font-mono text-xs border-r border-slate-200">29FGHIJ5678K1Z9</td>
            <td class="py-2.5 px-4 text-right text-slate-800 font-semibold border-r border-slate-200">75</td>
            <td class="py-2.5 px-4 text-center">
              <div class="flex items-center justify-center gap-1.5">
                <button 
                  type="button" 
                  title="Edit Record"
                  class="p-1.5 rounded-md text-blue-600 hover:text-blue-800 hover:bg-blue-50 active:bg-blue-100 transition-colors cursor-pointer"
                >
                  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 20h9"></path>
                    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                  </svg>
                </button>
                <button 
                  type="button" 
                  title="Delete Record"
                  class="p-1.5 rounded-md text-red-500 hover:text-red-700 hover:bg-red-50 active:bg-red-100 transition-colors cursor-pointer"
                >
                  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    <line x1="10" y1="11" x2="10" y2="17"></line>
                    <line x1="14" y1="11" x2="14" y2="17"></line>
                  </svg>
                </button>
              </div>
            </td>
          </tr>

          <!-- Row 3 -->
          <tr class="hover:bg-slate-50/60 transition-colors">
            <td class="py-2.5 px-4 text-center text-slate-800 font-medium border-r border-slate-200">3</td>
            <td class="py-2.5 px-4 text-slate-800 font-medium border-r border-slate-200">M/s. Metro Traders</td>
            <td class="py-2.5 px-4 text-center text-slate-700 font-mono text-xs border-r border-slate-200">29KLMNO9012P1Z3</td>
            <td class="py-2.5 px-4 text-right text-slate-800 font-semibold border-r border-slate-200">120</td>
            <td class="py-2.5 px-4 text-center">
              <div class="flex items-center justify-center gap-1.5">
                <button 
                  type="button" 
                  title="Edit Record"
                  class="p-1.5 rounded-md text-blue-600 hover:text-blue-800 hover:bg-blue-50 active:bg-blue-100 transition-colors cursor-pointer"
                >
                  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 20h9"></path>
                    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                  </svg>
                </button>
                <button 
                  type="button" 
                  title="Delete Record"
                  class="p-1.5 rounded-md text-red-500 hover:text-red-700 hover:bg-red-50 active:bg-red-100 transition-colors cursor-pointer"
                >
                  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    <line x1="10" y1="11" x2="10" y2="17"></line>
                    <line x1="14" y1="11" x2="14" y2="17"></line>
                  </svg>
                </button>
              </div>
            </td>
          </tr>

          <!-- Row 4 -->
          <tr class="hover:bg-slate-50/60 transition-colors">
            <td class="py-2.5 px-4 text-center text-slate-800 font-medium border-r border-slate-200">4</td>
            <td class="py-2.5 px-4 text-slate-800 font-medium border-r border-slate-200">M/s. Global Supplies</td>
            <td class="py-2.5 px-4 text-center text-slate-700 font-mono text-xs border-r border-slate-200">29QRSTU3456V1Z7</td>
            <td class="py-2.5 px-4 text-right text-slate-800 font-semibold border-r border-slate-200">60</td>
            <td class="py-2.5 px-4 text-center">
              <div class="flex items-center justify-center gap-1.5">
                <button 
                  type="button" 
                  title="Edit Record"
                  class="p-1.5 rounded-md text-blue-600 hover:text-blue-800 hover:bg-blue-50 active:bg-blue-100 transition-colors cursor-pointer"
                >
                  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 20h9"></path>
                    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                  </svg>
                </button>
                <button 
                  type="button" 
                  title="Delete Record"
                  class="p-1.5 rounded-md text-red-500 hover:text-red-700 hover:bg-red-50 active:bg-red-100 transition-colors cursor-pointer"
                >
                  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    <line x1="10" y1="11" x2="10" y2="17"></line>
                    <line x1="14" y1="11" x2="14" y2="17"></line>
                  </svg>
                </button>
              </div>
            </td>
          </tr>

          <!-- Row 5 -->
          <tr class="hover:bg-slate-50/60 transition-colors">
            <td class="py-2.5 px-4 text-center text-slate-800 font-medium border-r border-slate-200">5</td>
            <td class="py-2.5 px-4 text-slate-800 font-medium border-r border-slate-200">M/s. City Traders</td>
            <td class="py-2.5 px-4 text-center text-slate-700 font-mono text-xs border-r border-slate-200">29VWXYZ7890A1Z2</td>
            <td class="py-2.5 px-4 text-right text-slate-800 font-semibold border-r border-slate-200">90</td>
            <td class="py-2.5 px-4 text-center">
              <div class="flex items-center justify-center gap-1.5">
                <button 
                  type="button" 
                  title="Edit Record"
                  class="p-1.5 rounded-md text-blue-600 hover:text-blue-800 hover:bg-blue-50 active:bg-blue-100 transition-colors cursor-pointer"
                >
                  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 20h9"></path>
                    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                  </svg>
                </button>
                <button 
                  type="button" 
                  title="Delete Record"
                  class="p-1.5 rounded-md text-red-500 hover:text-red-700 hover:bg-red-50 active:bg-red-100 transition-colors cursor-pointer"
                >
                  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    <line x1="10" y1="11" x2="10" y2="17"></line>
                    <line x1="14" y1="11" x2="14" y2="17"></line>
                  </svg>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Summary Total Bar matching Screenshot Image 5 -->
    <div class="bg-slate-100/80 border-t border-slate-200 px-6 py-2.5 flex items-center justify-end gap-6">
      <div class="text-base md:text-lg font-bold text-slate-800 tracking-tight">
        Total No Of Bags
      </div>

      <!-- Solid Dark Blue Total Value Box -->
      <!-- Angular: {{ totalBags }} -->
      <div class="bg-[#1565c0] text-white font-bold text-lg md:text-xl px-12 py-1 rounded shadow-xs text-center min-w-[130px]">
        395
      </div>
    </div>
  </div>
</section>
